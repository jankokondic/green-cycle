services:
  postgres_green:
    image: postgres:16-alpine
    container_name: postgres_green
    restart: unless-stopped
    environment:
      POSTGRES_DB: green_cycle
      POSTGRES_USER: green_user
      POSTGRES_PASSWORD: green_password
    ports:
      - "12345:5432"
    volumes:
      - postgres_green_data:/var/lib/postgresql/data
    networks:
      - green_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U green_user -d green_cycle"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate_green:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: migrate_green
    depends_on:
      postgres_green:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://green_user:green_password@postgres_green:5432/green_cycle?sslmode=disable
    networks:
      - green_net
    restart: "no"

volumes:
  postgres_green_data:

networks:
  green_net:
    driver: bridge